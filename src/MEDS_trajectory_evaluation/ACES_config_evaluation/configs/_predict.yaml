defaults:
  - _self_

# Input
trajectories_dir: ???
task_labels_fp: ???

# Output
output_dir: ???

# Task
task:
  criteria_fp: ???
  predicates_fp: null

# Labeler relaxations (applied to the zero-shot task config before labeling)
labeler:
  remove_all_criteria: False
  collapse_temporal_gap_windows: False
  remove_post_label_windows: False

# Aggregation policy for the second stage
policy:
  invalid: drop
  indeterminable: drop

# Pipeline
worker: 0
seed: 1

# Hydra
log_dir: ${output_dir}/.logs

hydra:
  run:
    dir: "${log_dir}"
